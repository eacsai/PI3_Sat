# @package _global_
# Cross3R data-scaling ablation: train on 20% of CrossGeo data, lowres only.
defaults:
  - model: pi3_googlestreet_sat_C1_no_dualcam.yaml
  - train: train_pi3_lowres_megadepth
  - data: googlestreet_sat_data20.yaml
  - general: googlestreet_sat.yaml
  - extras: default.yaml
  - override hydra/job_logging: custom
  - override hydra/hydra_logging: colorlog
  - _self_

name: saved_runs/Cross3R_data20

# 20% data: dataset per-rank ≈ 1113 samples → assertion forces iters_per_epoch ≤ 34.
# Scale iters down + epochs up to keep total training steps ≈ 5100 (= full-data baseline).
train:
    iters_per_epoch: 30
    num_epoch: 170
