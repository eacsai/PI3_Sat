# @package _global_
# Cross3R-DualSat: sat branch outputs both ortho and perspective heads;
# both are supervised at training time. Inference selects between them
# via `sat_inference_mode`.

model:
    _target_: pi3.models.cross3r_dualsat.Cross3RDualSat
    load_pi3: true
    freeze_encoder: true
    num_dec_blk_not_to_checkpoint: 4
    ckpt: null
    sat_inference_mode: ortho

loss:
    train_loss:
        _target_: pi3.models.loss_dualsat.Pi3LossDualSat
        train_conf: false
        normal_loss_start_epoch: 5
    test_loss:
        _target_: pi3.models.loss_dualsat.Pi3LossDualSat
        train_conf: false
        normal_loss_start_epoch: 0

train:
    num_workers: 2
    batch_size: 1
    num_epoch: 30
    iters_per_epoch: 170
    print_freq: 10
    base_seed: 666
    model_dtype: bf16
    dynamo_backend: NO
    dynamic_compile: true
    gradient_accumulation_steps: 1
    clip_grad: 10.0
    clip_loss: 10
    seed: 42
    resume: null
    auto_resume: true
    start_epoch: 0
    global_step: 0
    world_size: 1
    rank: -1
    gpu: -1
    dist_on_itp: false
    find_unused_parameters: true
    distributed: false
    dist_url: env://
    dist_backend: "nccl"
    optimizer:
        type: AdamW
        lr: 5e-5
        weight_decay: 5e-2
        betas: [0.9, 0.95]
        verbose: true
        filter_bias_and_bn: true
        encoder_lr: 5e-6
    lr_scheduler:
        type: OneCycleLR
        max_lr: ${train.optimizer.lr}
        pct_start: 0.0
        anneal_strategy: cos
        div_factor: 1000.0
        final_div_factor: 100.0
        total_steps: -1

test:
    num_workers: 2
    batch_size: 1
    print_freq: 10
    iters_per_test: -1
