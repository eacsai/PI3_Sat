# @package _global_
# C3b: C1 + sat head as residual on learnable anchor (full 6-DOF, soft prior).
model:
    _target_: pi3.models.pi3_training_sat.Pi3
    pos_type: rope100
    decoder_size: large
    load_pi3: true
    freeze_encoder: true
    train_conf: false
    num_dec_blk_not_to_checkpoint: 4
    ckpt: null
    ablate_msfusion: false
    ablate_satinject: false
    ablate_satposembed: false
    ablate_double_register: false
    ablate_ortho: false
    depth_activation: softplus
    use_dual_camera_head: true
    use_sat_camera_inject: false
    sat_head_constrained: false
    use_geo_xattn: false
    sat_head_residual: true   # ← C3b change

loss:
    train_loss:
        _target_: pi3.models.loss.Pi3Loss
        train_conf: false
        normal_loss_start_epoch: 5

    test_loss:
        _target_: pi3.models.loss.Pi3Loss
        train_conf: false
        normal_loss_start_epoch: 0

train:
    num_workers: 2
    batch_size: 1
    num_epoch: 30
    iters_per_epoch: 170

    print_freq: 10
    base_seed: 666

    model_dtype: bf16
    dynamo_backend: NO
    dynamic_compile: true

    gradient_accumulation_steps: 1
    clip_grad: 10.0
    clip_loss: 10

    seed: 42
    resume: null
    auto_resume: true
    start_epoch: 0
    global_step: 0
    world_size: 1
    rank: -1
    gpu: -1
    dist_on_itp: false
    find_unused_parameters: true

    distributed: false
    dist_url: env://
    dist_backend: "nccl"

    optimizer:
        type: AdamW
        lr: 5e-5
        weight_decay: 5e-2
        betas: [0.9, 0.95]
        verbose: true
        filter_bias_and_bn: true
        encoder_lr: 5e-6

    lr_scheduler:
        type: OneCycleLR
        max_lr: ${train.optimizer.lr}
        pct_start: 0.0
        anneal_strategy: cos
        div_factor: 1000.0
        final_div_factor: 100.0
        total_steps: -1

test:
    num_workers: 2
    batch_size: 1
    print_freq: 10
    iters_per_test: -1
