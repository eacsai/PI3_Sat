# @package _global_
# Cross3R data-scaling ablation: 80% of training data (31169 / 38962 folders).

train_dataset:
    length: 31200

    weights:
        GoogleStreet: 31200

    GoogleStreet:
        _target_: datasets.googlestreet_dataset.GoogleStreetDataset
        data_root: /data/zhongyao/dataset/
        split: True
        shift_range: 20
        z_far: 30000
        frame_num: 3
        aug_crop: 16
        use_query: false
        use_sat: true
        data_pct: 0.8
        transform:
            _partial_: true
            _target_: datasets.base.transforms.JitterJpegLossBlurring
        aug_focal: 0.9
        mode: 'train'
        shuffle: false
        query_sample_count: 8192

train_dataloader:
    drop_last: True
    shuffle: True

test_dataset:
    weights:
        GoogleStreet: 450

    GoogleStreet:
        _target_: datasets.googlestreet_dataset.GoogleStreetDataset
        data_root: /data/zhongyao/dataset/
        split: True
        shift_range: 20
        z_far: 30000
        frame_num: 3
        use_query: false
        use_sat: true
        resolution:
            - [252, 252]
        transform:
            _partial_: true
            _target_: datasets.base.transforms.ImgToTensor
        mode: 'test'
        shuffle: false
        query_sample_count: 8192

test_dataloader:
    drop_last: False
    shuffle: False
