# @package _global_
# Same as googlestreet_sat.yaml but enables sat_rotation_aug on the train set.
# Test set keeps the default (no rotation) so eval numbers stay comparable to
# the C1 baseline.

train_dataset:
    length: 39000

    weights:
        GoogleStreet: 39000

    GoogleStreet:
        _target_: datasets.googlestreet_dataset.GoogleStreetDataset
        data_root: /data/zhongyao/dataset/
        split: True
        shift_range: 20
        z_far: 30000
        frame_num: 3
        aug_crop: 16
        use_query: false
        use_sat: true
        sat_rotation_aug: true
        transform:
            _partial_: true
            _target_: datasets.base.transforms.JitterJpegLossBlurring
        aug_focal: 0.9
        mode: 'train'
        shuffle: false
        query_sample_count: 8192

train_dataloader:
    drop_last: True
    shuffle: True

test_dataset:
    weights:
        GoogleStreet: 450

    GoogleStreet:
        _target_: datasets.googlestreet_dataset.GoogleStreetDataset
        data_root: /data/zhongyao/dataset/
        split: True
        shift_range: 20
        z_far: 30000
        frame_num: 3
        use_query: false
        use_sat: true
        sat_rotation_aug: false
        resolution:
            - [252, 252]
        transform:
            _partial_: true
            _target_: datasets.base.transforms.ImgToTensor
        mode: 'test'
        shuffle: false
        query_sample_count: 8192

test_dataloader:
    drop_last: False
    shuffle: False
