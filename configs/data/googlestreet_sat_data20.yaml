# @package _global_
# Cross3R data-scaling ablation: 20% of training data (7792 / 38962 folders).
# Same architecture (= C1_no_dualcam = Cross3R), only data subset changes.

train_dataset:
    length: 7800

    weights:
        GoogleStreet: 7800

    GoogleStreet:
        _target_: datasets.googlestreet_dataset.GoogleStreetDataset
        data_root: /data/zhongyao/dataset/
        split: True
        shift_range: 20
        z_far: 30000
        frame_num: 3
        aug_crop: 16
        use_query: false
        use_sat: true
        data_pct: 0.2
        transform:
            _partial_: true
            _target_: datasets.base.transforms.JitterJpegLossBlurring
        aug_focal: 0.9
        mode: 'train'
        shuffle: false
        query_sample_count: 8192

train_dataloader:
    drop_last: True
    shuffle: True

test_dataset:
    weights:
        GoogleStreet: 450

    GoogleStreet:
        _target_: datasets.googlestreet_dataset.GoogleStreetDataset
        data_root: /data/zhongyao/dataset/
        split: True
        shift_range: 20
        z_far: 30000
        frame_num: 3
        use_query: false
        use_sat: true
        resolution:
            - [252, 252]
        transform:
            _partial_: true
            _target_: datasets.base.transforms.ImgToTensor
        mode: 'test'
        shuffle: false
        query_sample_count: 8192

test_dataloader:
    drop_last: False
    shuffle: False
