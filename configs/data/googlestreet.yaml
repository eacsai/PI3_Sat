# @package _global_

train_dataset:
    length: 2500         # dummy

    weights: 
        GoogleStreet: 2500

    GoogleStreet:
        _target_: datasets.googlestreet_dataset.GoogleStreetDataset
        data_root: /data/zhongyao/dataset/0005_pair/0005_70_30 # 修改为你的 MegaDepth 数据集路径
        z_far: 30000
        frame_num: 3
        aug_crop: 16
        transform:
            _partial_: true
            _target_: datasets.base.transforms.JitterJpegLossBlurring
        aug_focal: 0.9
        mode: 'train'
        shuffle: false

train_dataloader:
    drop_last: True
    shuffle: True

test_dataset:
    weights: 
        GoogleStreet: 400

    GoogleStreet:
        _target_: datasets.googlestreet_dataset.GoogleStreetDataset
        data_root: /data/zhongyao/dataset/0005_pair/0005_70_30  # 修改为你的 MegaDepth 数据集路径
        z_far: 30000
        frame_num: 3
        resolution:
            - [252, 252]
        transform:
            _partial_: true
            _target_: datasets.base.transforms.ImgToTensor
        mode: 'test'
        shuffle: false

test_dataloader:
    drop_last: False
    shuffle: False
