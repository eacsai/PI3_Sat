# @package _global_

train_dataset:
    length: 39000         # 8000 Original and 39000 All

    weights: 
        GoogleStreet: 39000  # 8000 Original and 39000 All

    GoogleStreet:
        _target_: datasets.googlestreet_dataset.GoogleStreetDataset
        data_root: /data/zhongyao/dataset/ # 修改为你的 MegaDepth 数据集路径
        split: True
        shift_range: 20
        z_far: 30000
        frame_num: 3
        aug_crop: 16
        use_query: false
        transform:
            _partial_: true
            _target_: datasets.base.transforms.JitterJpegLossBlurring
        aug_focal: 0.9
        mode: 'train'
        shuffle: false
        query_sample_count: 8192

train_dataloader:
    drop_last: True
    shuffle: True

test_dataset:
    weights: 
        GoogleStreet: 450

    GoogleStreet:
        _target_: datasets.googlestreet_dataset.GoogleStreetDataset
        data_root: /data/zhongyao/dataset/  # 修改为你的 MegaDepth 数据集路径
        split: True
        shift_range: 20
        z_far: 30000
        frame_num: 3
        use_query: false
        resolution:
            - [252, 252]
        transform:
            _partial_: true
            _target_: datasets.base.transforms.ImgToTensor
        mode: 'test'
        shuffle: false
        query_sample_count: 8192

test_dataloader:
    drop_last: False
    shuffle: False
