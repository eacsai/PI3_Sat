# @package _global_

name: 'saved_runs/kitti_C1_finetune_camonly'
working_dir: ${work_dir}
random_seed: 1111

log:
  output_dir: '${work_dir}/outputs/${name}'
  use_tensorboard: false
  use_wandb: true
  wandb_init_conf:
    name: ${name}
    entity: innov1ise-shanghaitech-university
    project: pi3_kitti_C1_finetune
  summary_interval: 1
  ckpt_interval: 5
  max_checkpoints: 3
  ckpt_dir: '${work_dir}/outputs/${name}/ckpts'

hydra:
  run:
    dir: ${work_dir}/outputs/${name}

work_dir: ${hydra:runtime.cwd}
