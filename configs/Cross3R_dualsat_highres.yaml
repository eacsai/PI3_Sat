# @package _global_
# Cross3R-DualSat highres stage chained from the lowres best ckpt.
# Same architecture/loss as Cross3R_dualsat.yaml; eval at 504x504.

defaults:
  - model: pi3_googlestreet_sat_Cross3R_dualsat.yaml
  - train: train_pi3_highres
  - data: googlestreet_sat.yaml
  - general: googlestreet_sat.yaml
  - extras: default.yaml
  - override hydra/job_logging: custom
  - override hydra/hydra_logging: colorlog
  - _self_

name: saved_runs/Cross3R_dualsat_highres

train:
    image_num_range: [2, 3]
    max_img_per_gpu: 24
    pixel_count_range: [100000, 255000]
    iters_per_epoch: 170
    num_epoch: 30

model:
    load_pi3: false
    ckpt: /home/wangqw/video_program/Pi3/outputs/saved_runs/Cross3R_dualsat/ckpts/best_model/pytorch_model.bin
