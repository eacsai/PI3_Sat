# @package _global_
# Pi3_ori_highres: stage-2 dynamic high-res training.
defaults:
  - model: pi3_googlestreet_ori_highres.yaml
  - train: train_pi3_highres
  - data: googlestreet_ori.yaml
  - general: googlestreet_ori.yaml
  - extras: default.yaml
  - override hydra/job_logging: custom
  - override hydra/hydra_logging: colorlog
  - _self_

name: saved_runs/Pi3_ori_highres

# Override train_pi3_highres defaults with C1_highres-style settings
train:
    image_num_range: [2, 3]
    max_img_per_gpu: 24
    pixel_count_range: [100000, 255000]
    iters_per_epoch: 170
    num_epoch: 30

# Re-declare ckpt (train_pi3_highres sets model.ckpt: null which would override model config)
model:
    ckpt: /home/wangqw/video_program/Pi3/outputs/googlestreet_ori/ckpts/best_model/pytorch_model.bin
