# @package _global_
# Cross3R w/ raw sat height — same architecture as Cross3R (= C1_no_dualcam:
# all 5 sat modules, softplus depth, single shared camera head) but training
# data uses raw sat camera height from LMDB instead of the hardcoded -sat_gap.
defaults:
  - model: pi3_googlestreet_sat_C1_no_dualcam.yaml
  - train: train_pi3_lowres_megadepth
  - data: googlestreet_sat_rawh.yaml
  - general: googlestreet_sat.yaml
  - extras: default.yaml
  - override hydra/job_logging: custom
  - override hydra/hydra_logging: colorlog
  - _self_

name: saved_runs/Cross3R_rawh
