# @package _global_
# C2_highres: Stage-2 dynamic high-res training, continues from C2 best_model.
# Same training setup as C1_highres for fair comparison.
defaults:
  - model: pi3_googlestreet_sat_C2_highres.yaml
  - train: train_pi3_highres
  - data: googlestreet_sat.yaml
  - general: googlestreet_sat.yaml
  - extras: default.yaml
  - override hydra/job_logging: custom
  - override hydra/hydra_logging: colorlog
  - _self_

name: saved_runs/C2_highres

# Match C1_highres training settings for fair head-to-head comparison
train:
    image_num_range: [2, 3]
    max_img_per_gpu: 24
    pixel_count_range: [100000, 255000]
    iters_per_epoch: 170
    num_epoch: 30

# Re-declare ckpt (train_pi3_highres sets model.ckpt: null which would override model config)
model:
    ckpt: /home/wangqw/video_program/Pi3/outputs/saved_runs/C2/ckpts/best_model/pytorch_model.bin
