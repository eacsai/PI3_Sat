# @package _global_
# C1_satrot_highres: stage-2 dynamic high-res continuation of C1_satrot.
# Same architecture as C1_highres; ckpt chains from the satrot lowres run.
defaults:
  - model: pi3_googlestreet_sat_C1_highres.yaml
  - train: train_pi3_highres
  - data: googlestreet_sat_rotaug.yaml
  - general: googlestreet_sat.yaml
  - extras: default.yaml
  - override hydra/job_logging: custom
  - override hydra/hydra_logging: colorlog
  - _self_

name: saved_runs/C1_satrot_highres

train:
    image_num_range: [2, 3]
    max_img_per_gpu: 24
    pixel_count_range: [100000, 255000]
    iters_per_epoch: 170
    num_epoch: 30

# train_pi3_highres.yaml sets model.ckpt: null, which would override the model
# config. Re-declare here in _self_ so the satrot lowres best_model wins.
model:
    ckpt: /home/wangqw/video_program/Pi3/outputs/saved_runs/C1_satrot/ckpts/best_model/pytorch_model.bin
